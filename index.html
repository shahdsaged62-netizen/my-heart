
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Forever Love ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>رسالة ليك ❤️</h1>

        <div class="heart" id="mainHeart"
             onclick="showMessage()">
            <div class="heart-text" id="loveText">بحبك</div>
        </div>

        <h2>أنت أجمل حاجة حصلتلي 💗</h2>
        <p>اضغط على القلب واكتشف المفاجأة ❤️</p>
    </div>

    <div class="message-box" id="messageBox">
        <div class="message-content">
            <div class="big-heart">💗</div>
            <h2>إلى حبيبي ❤️</h2>

            <p>
                مهما اتكلمت بكل لغات العالم
                مش هقدر أوصف قد إيه بحبك
                <br><br>
                أنت أجمل صدفة وأحلى نصيب
                في حياتي
                <br><br>
                وجودك جنبي هو أجمل حاجة
                حصلتلي
                <br><br>
                بحبك النهارده وبكره
                وكل يوم أكتر من اللي قبله ❤️
            </p>

            <button onclick="closeMessage()">
                اقفل الرسالة 💕
            </button>
        </div>
    </div>

    <div id="hearts"></div>

    <script src="script.js"></script>
</body>
</html>
